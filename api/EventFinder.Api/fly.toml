# Fly.io deployment for the EventFinder South Africa REST API.
#
# Deploy from this directory:
#   fly launch --no-deploy    (first time only — creates the app)
#   fly volumes create eventfinder_data --size 1 --region jnb
#   fly deploy
#
# `app` must be globally unique on Fly. `fly launch` will offer to rename it if
# eventfinder-api is taken; update the name here to match.

app = "eventfinder-api"
primary_region = "jnb"  # Johannesburg — closest region to our users

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_HTTP_PORTS = "8080"
  # Points EF Core at the mounted volume below, so events survive restarts.
  ConnectionStrings__Default = "Data Source=/data/eventfinder.db"

# Persistent disk for the SQLite database. Without this the database is part of
# the machine's ephemeral filesystem and resets on every deploy.
[mounts]
  source = "eventfinder_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle to stay inside the free allowance. The first request
  # after an idle period wakes the machine and takes a few seconds.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # A volume is attached to a single machine, so do not scale past one.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
