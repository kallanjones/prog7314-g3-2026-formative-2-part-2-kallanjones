# Gradle daemon JVM tuning for faster builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is mandatory for modern Android projects
android.useAndroidX=true
# Kotlin code style - official
kotlin.code.style=official
# Non-transitive R classes keep the build lean and improve compile performance
android.nonTransitiveRClass=true
# Google OAuth 2.0 Web client ID used for Google sign-in (SSO).
# Create one under "Web application" at https://console.cloud.google.com/apis/credentials
# and paste it below. Leave blank to disable Google sign-in.
GOOGLE_WEB_CLIENT_ID=

# Base URL of the deployed EventFinder REST API, used by release builds.
# Update this after `fly deploy` if your Fly app has a different name.
API_BASE_URL_RELEASE=https://eventfinder-api.fly.dev/
